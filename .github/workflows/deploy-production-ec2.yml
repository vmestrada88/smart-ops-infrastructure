name: Deploy Production to EC2

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          test -n "$EC2_HOST" || (echo "❌ Missing secret: EC2_HOST" && exit 1)
          test -n "$EC2_USER" || (echo "❌ Missing secret: EC2_USER" && exit 1)
          test -n "$EC2_SSH_PRIVATE_KEY" || (echo "❌ Missing secret: EC2_SSH_PRIVATE_KEY" && exit 1)
          test -n "$GHCR_TOKEN" || (echo "❌ Missing secret: GHCR_TOKEN" && exit 1)

      - name: Prepare SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: vmestrada88
        run: |
          PORT="${EC2_SSH_PORT:-22}"
          APP_DIR="${EC2_APP_DIR:-~/smart-ops-infrastructure}"

          ssh -o BatchMode=yes -p "$PORT" "$EC2_USER@$EC2_HOST" "
            set -e
            export GHCR_TOKEN='$GHCR_TOKEN'
            export GHCR_USER='$GHCR_USER'
            cd $APP_DIR
            git fetch origin production
            git checkout production
            git reset --hard origin/production
            chmod +x deploy.sh ec2-update.sh
            ./deploy.sh
          "

      - name: Verify API health from EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
        run: |
          PORT="${EC2_SSH_PORT:-22}"
          ssh -o BatchMode=yes -p "$PORT" "$EC2_USER@$EC2_HOST" "curl -fsS http://localhost:5000/api/health"