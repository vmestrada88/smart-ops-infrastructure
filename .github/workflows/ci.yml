name: Infrastructure CI

on:
  pull_request:
    branches: [dev, test, staging, production]
  push:
    branches: [dev, test, staging, production]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose rendering
        run: docker compose --env-file .env.production.sample -f docker-compose.prod.yml config

      - name: Validate shell scripts syntax
        run: |
          bash -n deploy.sh
          bash -n ec2-update.sh
          bash -n setup-nginx.sh
          bash -n setup-ssl.sh
