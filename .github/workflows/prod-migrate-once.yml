name: One-off prod DB migration (clients status)

on:
  push:
    branches: [claude/project-thread-e5bair]
    paths: [ops/prod-migrate-2026-11-16.sh, .github/workflows/prod-migrate-once.yml]

concurrency:
  group: deploy-production-ec2
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Backup + migrate on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
        run: |
          PORT="${EC2_SSH_PORT:-22}"
          ssh -o BatchMode=yes -p "$PORT" "$EC2_USER@$EC2_HOST" 'sh -s' < ops/prod-migrate-2026-11-16.sh
